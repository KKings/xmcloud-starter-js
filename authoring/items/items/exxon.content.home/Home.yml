        <ul role="list">
            <li>Funding enables the global Red Cross network to deliver urgent humanitarian aid.</li>
            <li>Red Cross assistance includes shelter, relief supplies, medical care, safe water, family reunification and recovery support.</li>
        </ul>
        <h3>Contribution to support earthquake relief</h3>
        <p><span>SPRING, Texas&nbsp;&ndash; ExxonMobil today announced a $500,000 donation to the American Red Cross to support relief efforts following the June 2026 earthquakes in Venezuela.</span><br />
        <span>The contribution will support the American Red Cross and its global Red Cross network as they provide critical assistance to communities impacted by the disaster. The organizations will use the funds to address urgent humanitarian needs and support recovery efforts where help is needed most.</span><br />
        <span>&ldquo;Our thoughts are with the people and communities affected by the devastating earthquakes in Venezuela,&rdquo; said Alvin Abraham, global manager of corporate giving at ExxonMobil. &ldquo;Our contribution aims to help ensure affected communities receive the care and resources they need.&rdquo;</span><br />
        <span>Donations to the American Red Cross designated for Venezuela earthquake relief efforts will provide a range of support services, including emergency shelter, relief supplies, cash assistance, health care, safe water and sanitation, psychosocial support, family reunification services, and other recovery assistance for people impacted by the earthquakes. ExxonMobil commends the first responders, volunteers, and community leaders working tirelessly on the ground to support relief efforts.</span></p>
